<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Cá Nhân - Đam Mê & Tập Trung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#FFD700',
                        darkBg: '#0f0f0f',
                        cardBg: '#1a1a1a',
                        borderGold: '#332b00'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f0f0f; color: #e5e5e5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .gold-glow { text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .border-gold-glow { box-shadow: 0 0 15px rgba(255, 215, 0, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="border-b border-borderGold bg-cardBg py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-crown text-gold text-2xl gold-glow"></i>
            <h1 class="text-xl font-bold text-gold tracking-wide">NHẬT KÝ & LỊCH TRÌNH</h1>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="requestNotificationPermission()" class="text-xs bg-borderGold text-gold px-3 py-1.5 rounded-lg border border-gold/30 hover:bg-gold/20 transition">
                <i class="fa-solid fa-bell mr-1"></i> Bật Thông Báo
            </button>
            <span id="current-date-display" class="text-sm text-gray-400"></span>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Cột Trái: Nhập liệu & Pomodoro -->
        <div class="space-y-6">
            <div class="bg-cardBg border border-borderGold rounded-xl p-5 border-gold-glow">
                <h2 class="text-lg font-semibold text-gold mb-4 flex items-center">
                    <i class="fa-solid fa-pen-nib mr-2"></i> Thêm Sự Kiện & Ghi Chú
                </h2>
                <form id="event-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase text-gray-400 mb-1 font-semibold">Tiêu đề việc cần làm</label>
                        <input type="text" id="event-title" required class="w-full bg-darkBg border border-borderGold rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-gold">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs uppercase text-gray-400 mb-1 font-semibold">Ngày</label>
                            <input type="date" id="event-date" required class="w-full bg-darkBg border border-borderGold rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-gold">
                        </div>
                        <div>
                            <label class="block text-xs uppercase text-gray-400 mb-1 font-semibold">Giờ</label>
                            <input type="time" id="event-time" required class="w-full bg-darkBg border border-borderGold rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-gold">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-gray-400 mb-1 font-semibold">Ghi chú chi tiết</label>
                        <textarea id="event-desc" rows="2" class="w-full bg-darkBg border border-borderGold rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-gold"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-gold text-darkBg font-bold py-2.5 rounded-lg hover:bg-yellow-400 transition flex items-center justify-center">
                        <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Lưu & Hiện Lịch Ngay
                    </button>
                </form>
            </div>

            <div class="bg-cardBg border border-borderGold rounded-xl p-5 border-gold-glow text-center">
                <h2 class="text-lg font-semibold text-gold mb-2 flex items-center justify-center">
                    <i class="fa-solid fa-clock mr-2"></i> Bộ Đếm Thời Gian Tập Trung
                </h2>
                <p class="text-xs text-gray-400 mb-4">Pomodoro: 25 phút làm việc / 5 phút nghỉ</p>
                <div id="timer-display" class="text-4xl font-mono font-bold text-gold mb-4 gold-glow">25:00</div>
                <div class="flex justify-center space-x-3">
                    <button onclick="startTimer()" class="bg-gold text-darkBg px-4 py-2 rounded-lg font-bold text-sm hover:bg-yellow-400"><i class="fa-solid fa-play"></i> Bắt đầu</button>
                    <button onclick="pauseTimer()" class="bg-borderGold text-gold px-4 py-2 rounded-lg font-bold text-sm border border-gold/30 hover:bg-gold/20"><i class="fa-solid fa-pause"></i> Tạm dừng</button>
                    <button onclick="resetTimer()" class="bg-borderGold text-gray-400 px-4 py-2 rounded-lg font-bold text-sm border border-gray-700 hover:text-white"><i class="fa-solid fa-rotate-right"></i> Đặt lại</button>
                </div>
            </div>
        </div>

        <!-- Cột Phải: Lịch & Danh Sách -->
        <div class="lg:col-span-2 space-y-6">
            <!-- Nút chuyển đổi giao diện: Lịch Tháng / Lịch Tuần / Danh Sách -->
            <div class="bg-cardBg border border-borderGold rounded-xl p-4 flex flex-wrap justify-between items-center gap-4">
                <div class="flex space-x-2">
                    <button onclick="switchView('month')" id="btn-month" class="px-4 py-2 rounded-lg text-sm font-semibold bg-gold text-darkBg">Lịch Tháng</button>
                    <button onclick="switchView('week')" id="btn-week" class="px-4 py-2 rounded-lg text-sm font-semibold bg-darkBg text-gray-400 border border-borderGold hover:text-gold">Lịch Tuần (Chi Tiết Giờ)</button>
                    <button onclick="switchView('list')" id="btn-list" class="px-4 py-2 rounded-lg text-sm font-semibold bg-darkBg text-gray-400 border border-borderGold hover:text-gold">Danh Sách Việc</button>
                </div>
                <div id="loading-status" class="text-xs text-gold animate-pulse hidden"><i class="fa-solid fa-rotate mr-1"></i> Đang đồng bộ...</div>
            </div>

            <div class="bg-cardBg border border-borderGold rounded-xl p-5 min-h-[450px]">
                <!-- VIEW 1: LỊCH THÁNG (Hiện tên + giờ trực tiếp) -->
                <div id="month-view">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="month-title" class="text-lg font-bold text-gold">Tháng ...</h3>
                        <div class="space-x-2">
                            <button onclick="changeMonth(-1)" class="p-2 bg-darkBg border border-borderGold rounded hover:text-gold"><i class="fa-solid fa-chevron-left"></i></button>
                            <button onclick="changeMonth(1)" class="p-2 bg-darkBg border border-borderGold rounded hover:text-gold"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center font-semibold text-xs text-gray-400 mb-2">
                        <div class="text-red-400">CN</div><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 gap-2 text-center text-sm"></div>
                </div>

                <!-- VIEW 2: LỊCH TUẦN (Chia khung giờ chi tiết) -->
                <div id="week-view" class="hidden">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="week-title" class="text-lg font-bold text-gold">Lịch Chi Tiết Theo Tuần</h3>
                        <div class="space-x-2">
                            <button onclick="changeWeek(-1)" class="p-2 bg-darkBg border border-borderGold rounded hover:text-gold"><i class="fa-solid fa-chevron-left"></i> Tuần trước</button>
                            <button onclick="changeWeek(1)" class="p-2 bg-darkBg border border-borderGold rounded hover:text-gold">Tuần sau <i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <div id="week-grid" class="min-w-[700px] space-y-2"></div>
                    </div>
                </div>

                <!-- VIEW 3: DANH SÁCH VIỆC CẦN LÀM -->
                <div id="list-view" class="hidden space-y-3">
                    <h3 class="text-lg font-bold text-gold mb-2">Danh Sách Việc & Tích Xóa</h3>
                    <div id="events-container" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0IU2-X0NU9h5F9l0rY3wTQklX1tYZKkF7x3vRwC-IrzqHKXXB351NQrvT-_iaTQ0M/exec";

        let eventsData = [];
        let currentDate = new Date();
        let weekStartDate = new Date();
        let timerInterval = null;
        let timeLeft = 25 * 60;

        document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        async function fetchEvents() {
            if (SCRIPT_URL.includes("YOUR_GOOGLE_")) return;
            showLoading(true);
            try {
                let response = await fetch(SCRIPT_URL);
                let rawData = await response.json();
                
                eventsData = rawData.map(ev => {
                    let d = String(ev.date || "").trim();
                    if (d.includes('T')) d = d.split('T')[0];
                    else if (d.length >= 10) d = d.substring(0, 10);
                    return { ...ev, date: d };
                });

                renderCalendar();
                renderWeekView();
                renderListView();
            } catch (error) {
                console.error("Lỗi tải dữ liệu:", error);
            }
            showLoading(false);
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('event-title').value;
            const date = document.getElementById('event-date').value;
            const time = document.getElementById('event-time').value;
            const description = document.getElementById('event-desc').value;
            const id = 'EV-' + Date.now();

            // Đẩy ngay vào mảng web để hiển thị tức thì
            eventsData.push({ id, title, date, time, description, status: "Chưa xong" });
            renderCalendar();
            renderWeekView();
            renderListView();

            document.getElementById('event-form').reset();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'add', id, title, date, time, description })
                });
            } catch (error) {
                console.error("Lỗi đồng bộ Sheet:", error);
            }
        }

        async function completeEvent(id) {
            if(!confirm("Bạn có chắc muốn hoàn thành và xóa sự kiện này không?")) return;
            
            eventsData = eventsData.filter(ev => ev.id !== id);
            renderCalendar();
            renderWeekView();
            renderListView();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', id: id })
                });
            } catch (error) {
                console.error("Lỗi xóa trên Sheet:", error);
            }
        }

        function showLoading(show) {
            const el = document.getElementById('loading-status');
            if(show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function switchView(view) {
            const monthView = document.getElementById('month-view');
            const weekView = document.getElementById('week-view');
            const listView = document.getElementById('list-view');
            
            const btnMonth = document.getElementById('btn-month');
            const btnWeek = document.getElementById('btn-week');
            const btnList = document.getElementById('btn-list');

            monthView.classList.add('hidden');
            weekView.classList.add('hidden');
            listView.classList.add('hidden');

            btnMonth.className = "px-4 py-2 rounded-lg text-sm font-semibold bg-darkBg text-gray-400 border border-borderGold hover:text-gold";
            btnWeek.className = "px-4 py-2 rounded-lg text-sm font-semibold bg-darkBg text-gray-400 border border-borderGold hover:text-gold";
            btnList.className = "px-4 py-2 rounded-lg text-sm font-semibold bg-darkBg text-gray-400 border border-borderGold hover:text-gold";

            if (view === 'month') {
                monthView.classList.remove('hidden');
                btnMonth.className = "px-4 py-2 rounded-lg text-sm font-semibold bg-gold text-darkBg";
                renderCalendar();
            } else if (view === 'week') {
                weekView.classList.remove('hidden');
                btnWeek.className = "px-4 py-2 rounded-lg text-sm font-semibold bg-gold text-darkBg";
                renderWeekView();
            } else {
                listView.classList.remove('hidden');
                btnList.className = "px-4 py-2 rounded-lg text-sm font-semibold bg-gold text-darkBg";
                renderListView();
            }
        }

        // 1. RENDER LỊCH THÁNG (Hiện tên sự kiện + giờ trực tiếp vào ô ngày)
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('month-title').innerText = `Tháng ${month + 1} / ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="p-2 text-gray-700"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const mStr = String(month + 1).padStart(2, '0');
                const dStr = String(day).padStart(2, '0');
                const targetDateStr = `${year}-${mStr}-${dStr}`;

                const dayEvents = eventsData.filter(ev => ev.date === targetDateStr);

                let eventsHtml = '';
                dayEvents.forEach(ev => {
                    eventsHtml += `<div class="bg-gold/20 text-gold text-[10px] px-1 py-0.5 rounded truncate mt-1 font-semibold" title="${ev.time} - ${ev.title}">🕒 ${ev.time || ''} ${ev.title}</div>`;
                });

                grid.innerHTML += `
                    <div class="p-1.5 h-24 border border-borderGold/50 rounded-lg flex flex-col justify-start bg-darkBg relative hover:border-gold transition overflow-hidden text-left">
                        <span class="text-xs font-semibold ${dayEvents.length > 0 ? 'text-gold font-bold' : 'text-gray-300'}">${day}</span>
                        <div class="mt-1 space-y-1 overflow-y-auto max-h-16 w-full">
                            ${eventsHtml}
                        </div>
                    </div>
                `;
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        // 2. RENDER LỊCH TUẦN (Chia theo các ngày trong tuần kèm giờ cụ thể)
        function renderWeekView() {
            const container = document.getElementById('week-grid');
            container.innerHTML = '';
            
            // Lấy ra các ngày trong tuần hiện tại
            let startOfWeek = new Date(weekStartDate);
            let dayOfWeek = startOfWeek.getDay();
            let diff = startOfWeek.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1); // Bắt đầu từ thứ 2
            startOfWeek.setDate(diff);

            let weekDays = [];
            for (let i = 0; i < 7; i++) {
                let nextDay = new Date(startOfWeek);
                nextDay.setDate(startOfWeek.getDate() + i);
                weekDays.push(nextDay);
            }

            let startStr = weekDays[0].toLocaleDateString('vi-VN', {day: '2-digit', month: '2-digit'});
            let endStr = weekDays[6].toLocaleDateString('vi-VN', {day: '2-digit', month: '2-digit'});
            document.getElementById('week-title').innerText = `Lịch Tuần (${startStr} - ${endStr})`;

            weekDays.forEach(dayObj => {
                let y = dayObj.getFullYear();
                let m = String(dayObj.getMonth() + 1).padStart(2, '0');
                let d = String(dayObj.getDate()).padStart(2, '0');
                let dateStr = `${y}-${m}-${d}`;
                let dayName = dayObj.toLocaleDateString('vi-VN', {weekday: 'long'});

                let dayEvents = eventsData.filter(ev => ev.date === dateStr);
                let eventsHtml = '';

                if (dayEvents.length === 0) {
                    eventsHtml = `<p class="text-xs text-gray-500 italic">Không có sự kiện</p>`;
                } else {
                    dayEvents.forEach(ev => {
                        eventsHtml += `
                            <div class="bg-gold/15 border border-gold/40 p-2 rounded flex justify-between items-center text-xs">
                                <div>
                                    <span class="text-gold font-bold mr-2"><i class="fa-regular fa-clock mr-1"></i>${ev.time || 'Cả ngày'}</span>
                                    <span class="text-white font-semibold">${ev.title}</span>
                                    ${ev.description ? `<span class="text-gray-400 ml-2">(${ev.description})</span>` : ''}
                                </div>
                                <button onclick="completeEvent('${ev.id}')" class="text-red-400 hover:text-red-300 text-xs px-2 py-0.5 rounded border border-red-500/30">Xong</button>
                            </div>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="bg-darkBg border border-borderGold p-3 rounded-lg flex flex-col space-y-2">
                        <div class="text-gold font-bold text-xs uppercase border-b border-borderGold pb-1 flex justify-between">
                            <span>${dayName} (${d}/${m})</span>
                        </div>
                        <div class="space-y-1">
                            ${eventsHtml}
                        </div>
                    </div>
                `;
            });
        }

        function changeWeek(direction) {
            weekStartDate.setDate(weekStartDate.getDate() + (direction * 7));
            renderWeekView();
        }

        // 3. RENDER DANH SÁCH VIỆC
        function renderListView() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            if (eventsData.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm">Chưa có sự kiện nào được ghi nhận.</p>`;
                return;
            }

            eventsData.forEach(ev => {
                container.innerHTML += `
                    <div class="bg-darkBg border border-borderGold p-3 rounded-lg flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" onclick="completeEvent('${ev.id}')" class="w-5 h-5 accent-gold cursor-pointer" title="Hoàn thành & xóa">
                            <div>
                                <h4 class="text-gold font-semibold text-sm">${ev.title}</h4>
                                <p class="text-xs text-gray-400"><i class="fa-regular fa-calendar mr-1"></i>${ev.date} - <i class="fa-regular fa-clock mr-1"></i>${ev.time || 'Cả ngày'}</p>
                                ${ev.description ? `<p class="text-xs text-gray-500 mt-1">${ev.description}</p>` : ''}
                            </div>
                        </div>
                        <span class="text-xs bg-gold/10 text-gold px-2 py-1 rounded border border-gold/30">Chưa xong</span>
                    </div>
                `;
            });
        }

        // Timer Logic
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("Đã hoàn thành một phiên Pomodoro! Hãy nghỉ ngơi 5 phút nhé.");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") alert("Đã bật quyền thông báo trình duyệt thành công!");
                });
            }
        }

        fetchEvents();
    </script>
</body>
</html>
