<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Cá Nhân - Đam Mê & Tập Trung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- FullCalendar CSS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#FFD700',
                        darkBg: '#0f0f0f',
                        cardBg: '#1a1a1a',
                        borderGold: '#332b00'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f0f0f; color: #e5e5e5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .gold-glow { text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .border-gold-glow { box-shadow: 0 0 15px rgba(255, 215, 0, 0.15); }
        /* Tùy chỉnh màu sắc FullCalendar cho hợp tông Dark & Gold */
        .fc { --fc-border-color: #332b00; --fc-page-bg-color: #1a1a1a; --fc-neutral-bg-color: #0f0f0f; --fc-list-event-hover-bg-color: #262000; }
        .fc-theme-standard td, .fc-theme-standard th { border-color: #332b00; }
        .fc-col-header-cell-cushion { color: #FFD700 !important; font-weight: bold; text-decoration: none; }
        .fc-daygrid-day-number { color: #ccc !important; text-decoration: none; font-size: 13px; padding: 6px !important; }
        .fc-event { background-color: rgba(255, 215, 0, 0.15); border: 1px solid #FFD700; color: #FFD700; padding: 2px 4px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .fc-toolbar-title { color: #FFD700 !important; font-size: 1.2rem !important; font-weight: bold; }
        .fc-button-primary { background-color: #332b00 !important; border-color: #FFD700 !important; color: #FFD700 !important; font-size: 12px !important; }
        .fc-button-primary:hover { background-color: #FFD700 !important; color: #0f0f0f !important; }
        .fc-button-active { background-color: #FFD700 !important; color: #0f0f0f !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="border-b border-borderGold bg-cardBg py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-crown text-gold text-2xl gold-glow"></i>
            <h1 class="text-xl font-bold text-gold tracking-wide">NHẬT KÝ & LỊCH TRÌNH</h1>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="requestNotificationPermission()" class="text-xs bg-borderGold text-gold px-3 py-1.5 rounded-lg border border-gold/30 hover:bg-gold/20 transition">
                <i class="fa-solid fa-bell mr-1"></i> Bật Thông Báo
            </button>
            <span id="current-date-display" class="text-sm text-gray-400"></span>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Cột Trái: Nhập liệu & Pomodoro -->
        <div class="space-y-6">
            <div class="bg-cardBg border border-borderGold rounded-xl p-5 border-gold-glow">
                <h2 class="text-lg font-semibold text-gold mb-4 flex items-center">
                    <i class="fa-solid fa-pen-nib mr-2"></i> Thêm Sự Kiện & Ghi Chú
                </h2>
                <form id="event-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase text-gray-400 mb-1 font-semibold">Tiêu đề việc cần làm</label>
                        <input type="text" id="event-title" required class="w-full bg-darkBg border border-borderGold rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-gold">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs uppercase text-gray-400 mb-1 font-semibold">Ngày</label>
                            <input type="date" id="event-date" required class="w-full bg-darkBg border border-borderGold rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-gold">
                        </div>
                        <div>
                            <label class="block text-xs uppercase text-gray-400 mb-1 font-semibold">Giờ</label>
                            <input type="time" id="event-time" required class="w-full bg-darkBg border border-borderGold rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-gold">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-gray-400 mb-1 font-semibold">Ghi chú chi tiết</label>
                        <textarea id="event-desc" rows="2" class="w-full bg-darkBg border border-borderGold rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-gold"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-gold text-darkBg font-bold py-2.5 rounded-lg hover:bg-yellow-400 transition flex items-center justify-center">
                        <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Lưu & Hiện Lịch Ngay
                    </button>
                </form>
            </div>

            <div class="bg-cardBg border border-borderGold rounded-xl p-5 border-gold-glow text-center">
                <h2 class="text-lg font-semibold text-gold mb-2 flex items-center justify-center">
                    <i class="fa-solid fa-clock mr-2"></i> Bộ Đếm Thời Gian Tập Trung
                </h2>
                <p class="text-xs text-gray-400 mb-4">Pomodoro: 25 phút làm việc / 5 phút nghỉ</p>
                <div id="timer-display" class="text-4xl font-mono font-bold text-gold mb-4 gold-glow">25:00</div>
                <div class="flex justify-center space-x-3">
                    <button onclick="startTimer()" class="bg-gold text-darkBg px-4 py-2 rounded-lg font-bold text-sm hover:bg-yellow-400"><i class="fa-solid fa-play"></i> Bắt đầu</button>
                    <button onclick="pauseTimer()" class="bg-borderGold text-gold px-4 py-2 rounded-lg font-bold text-sm border border-gold/30 hover:bg-gold/20"><i class="fa-solid fa-pause"></i> Tạm dừng</button>
                    <button onclick="resetTimer()" class="bg-borderGold text-gray-400 px-4 py-2 rounded-lg font-bold text-sm border border-gray-700 hover:text-white"><i class="fa-solid fa-rotate-right"></i> Đặt lại</button>
                </div>
            </div>
        </div>

        <!-- Cột Phải: Lịch & Danh sách công việc -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-cardBg border border-borderGold rounded-xl p-4 flex justify-between items-center">
                <div class="text-gold font-semibold text-sm"><i class="fa-regular fa-calendar-days mr-2"></i> Lịch Tổng Quan Tháng</div>
                <div id="loading-status" class="text-xs text-gold animate-pulse hidden"><i class="fa-solid fa-rotate mr-1"></i> Đang đồng bộ...</div>
            </div>

            <!-- Khung Lịch chuẩn FullCalendar (Hiện tên sự kiện + giờ trực tiếp trên ô) -->
            <div class="bg-cardBg border border-borderGold rounded-xl p-4">
                <div id="calendar" class="text-sm"></div>
            </div>

            <!-- Danh sách việc cần làm có ô tích xóa -->
            <div class="bg-cardBg border border-borderGold rounded-xl p-5">
                <h3 class="text-lg font-bold text-gold mb-3">Danh Sách Việc Cần Làm</h3>
                <div id="events-container" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0IU2-X0NU9h5F9l0rY3wTQklX1tYZKkF7x3vRwC-IrzqHKXXB351NQrvT-_iaTQ0M/exec";

        let calendar;
        let eventsData = [];
        let timerInterval = null;
        let timeLeft = 25 * 60;

        document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'vi',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                events: []
            });
            calendar.render();
            fetchEvents();
        });

        async function fetchEvents() {
            if (SCRIPT_URL.includes("YOUR_GOOGLE_")) return;
            showLoading(true);
            try {
                let response = await fetch(SCRIPT_URL);
                let rawData = await response.json();
                
                eventsData = rawData.map(ev => ({
                    id: String(ev.id),
                    title: `${ev.time ? ev.time + ' - ' : ''}${ev.title}`, // Hiện kèm giờ và tên sự kiện
                    start: String(ev.date).split('T')[0],
                    description: ev.description,
                    time: ev.time,
                    rawTitle: ev.title
                }));

                updateCalendarEvents();
                renderListView();
            } catch (error) {
                console.error("Lỗi tải dữ liệu:", error);
            }
            showLoading(false);
        }

        function updateCalendarEvents() {
            calendar.removeAllEvents();
            eventsData.forEach(ev => {
                calendar.addEvent({
                    id: ev.id,
                    title: ev.title,
                    start: ev.start
                });
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('event-title').value;
            const date = document.getElementById('event-date').value;
            const time = document.getElementById('event-time').value;
            const description = document.getElementById('event-desc').value;
            const id = 'EV-' + Date.now();

            // Đẩy ngay lập tức lên lịch hiển thị trên web không cần chờ
            const newEventObj = {
                id,
                title: `${time ? time + ' - ' : ''}${title}`,
                start: date,
                description,
                time,
                rawTitle: title
            };
            eventsData.push(newEventObj);
            updateCalendarEvents();
            renderListView();

            document.getElementById('event-form').reset();

            // Gửi ngầm lên Google Sheet
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'add', id, title, date, time, description })
                });
            } catch (error) {
                console.error("Lỗi đồng bộ Sheet:", error);
            }
        }

        async function completeEvent(id) {
            if(!confirm("Bạn có chắc muốn hoàn thành và xóa sự kiện này không?")) return;

            eventsData = eventsData.filter(ev => ev.id !== id);
            updateCalendarEvents();
            renderListView();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', id: id })
                });
            } catch (error) {
                console.error("Lỗi xóa trên Sheet:", error);
            }
        }

        function renderListView() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            if (eventsData.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm">Chưa có sự kiện nào được ghi nhận trên Google Sheet.</p>`;
                return;
            }

            eventsData.forEach(ev => {
                container.innerHTML += `
                    <div class="bg-darkBg border border-borderGold p-3 rounded-lg flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" onclick="completeEvent('${ev.id}')" class="w-5 h-5 accent-gold cursor-pointer" title="Hoàn thành & xóa">
                            <div>
                                <h4 class="text-gold font-semibold text-sm">${ev.rawTitle || ev.title}</h4>
                                <p class="text-xs text-gray-400"><i class="fa-regular fa-calendar mr-1"></i>${ev.start} - <i class="fa-regular fa-clock mr-1"></i>${ev.time || 'Cả ngày'}</p>
                                ${ev.description ? `<p class="text-xs text-gray-500 mt-1">${ev.description}</p>` : ''}
                            </div>
                        </div>
                        <span class="text-xs bg-gold/10 text-gold px-2 py-1 rounded border border-gold/30">Chưa xong</span>
                    </div>
                `;
            });
        }

        function showLoading(show) {
            const el = document.getElementById('loading-status');
            if(show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        // Timer Logic
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("Đã hoàn thành một phiên Pomodoro! Hãy nghỉ ngơi 5 phút nhé.");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") alert("Đã bật quyền thông báo trình duyệt thành công!");
                });
            }
        }
    </script>
</body>
</html>
